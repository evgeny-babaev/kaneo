name: Global image
on:
  push:
    branches: [deploy/global]
    paths:
      - '.github/workflows/global-image.yml'
      - 'Dockerfile.kaneo'
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'patches/**'
      - 'i18n/**'
      - 'vite.config.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'evgeny-babaev/kaneo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build fork
        run: docker build -f Dockerfile.kaneo --label org.opencontainers.image.revision=${{ github.sha }} -t kaneo-global:${{ github.sha }} .
      - name: Export image
        run: |
          docker save kaneo-global:${{ github.sha }} | gzip -1 > kaneo-global.tar.gz
          sha256sum kaneo-global.tar.gz > kaneo-global.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kaneo-global-image
          path: |
            kaneo-global.tar.gz
            kaneo-global.tar.gz.sha256
          compression-level: 0
          retention-days: 3
